[build-system]
requires = [
  "setuptools",
  "wheel",
  "scikit-build >= 0.18.1",
  "pybind11 >= 3.0.1",
  "ninja",
  "cmake >= 4.2.1",
  "mypy"
]
build-backend = "setuptools.build_meta"

[project]
name = "aihwkit"
dynamic = ["version"]
dependencies = [
  "cmake >= 4.2.1",
  "scikit-build >= 0.18.1",
  "scikit-learn",
  "pybind11 >= 3.0.1",
  "torch",
  "torchvision",
  "scipy",
  "requests >= 2.32, <3",
  "numpy",
  "protobuf",
  "tqdm",
  "mypy",
]
requires-python = ">=3.10"
authors = [
  { name = "IBM Research", email = "aihwkit@us.ibm.com" },
]
description = "IBM Analog Hardware Acceleration Kit"
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = [
  "ai",
  "analog",
  "rpu",
  "torch",
  "memristor",
  "pcm",
  "reram",
  "crossbar",
  "in-memory",
  "nvm",
  "non-von-neumann",
  "non-volatile memory",
  "phase-change material",
]
classifiers=[
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "types-dataclasses",
  "types-requests",
  "pycodestyle",
  "pylint",
  "pytest",
  "parameterized",
  "black",
]

examples = [
  "matplotlib >= 3.10",
  "pyamg",
  "jupyter",
  "transformers",
  "evaluate",
  "accelerate",
  "lmfit",
  "tensorboard",
]

[project.urls]
Homepage = "https://github.com/IBM/aihwkit"
Documentation = "https://aihwkit.readthedocs.io/en/latest/"
Repository = "https://github.com/IBM/aihwkit.git"
Issues = "https://github.com/IBM/aihwkit/issues"
Changelog = "https://github.com/IBM/aihwkit/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {file = "src/aihwkit/VERSION.txt"}

[tool.black]
line-length = 100

[tool.cibuildwheel]
build = ["cp314-manylinux_x86_64", "cp314-macosx_*"]

build-frontend = "pip; args: --no-build-isolation"

before-build = '''
pip install \
    "cmake>=4.2.1" \
    "scikit-build>=0.18.1" \
    "pybind11>=3.0.1" \
    "requests>=2.32,<3" \
    torch \
    torchvision \
    scikit-learn \
    scipy \
    numpy \
    protobuf \
    tqdm \
    mypy
'''

container-engine = "podman"

test-command = "PYTHONPATH=src/ pytest -v -s ./tests/"
test-requires = "pytest"

manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "yum install -y openblas-devel"

repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libtorch_python.so"

[tool.cibuildwheel.macos]
archs = ["arm64"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
